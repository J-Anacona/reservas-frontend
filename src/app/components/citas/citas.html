<div class="container">

    <h1 class="titulo">
        Gestión de Citas
    </h1>

    <div class="acciones">

        <button
            class="btn"
            routerLink="/view-appointments">

            Ver Citas

        </button>

    </div>

    <div class="formulario">

        <h2>Agendar Nueva Cita</h2>

        <form (ngSubmit)="agendarCita()">

            <div class="campo">

                <label>Nombre</label>

                <input
                    type="text"
                    [(ngModel)]="nuevaCita.nombre"
                    name="nombre"
                    required>

            </div>

            <div class="campo">

                <label>Apellido</label>

                <input
                    type="text"
                    [(ngModel)]="nuevaCita.apellido"
                    name="apellido"
                    required>

            </div>

            <div class="campo">

                <label>Documento</label>

                <input
                    type="text"
                    [(ngModel)]="nuevaCita.documento"
                    name="documento"
                    required>

            </div>

            <div class="campo">

                <label>Fecha y Hora</label>

                <input
                    type="datetime-local"
                    [(ngModel)]="nuevaCita.fecha"
                    name="fecha"
                    required>

            </div>

            <button
                type="submit"
                class="btn">

                Agendar Cita

            </button>

        </form>

    </div>

</div>
