<div class="citas">

    <!-- BARRA SUPERIOR -->
    <header class="barra">

        <button type="button" class="enlace" (click)="cerrarSesion()">
            <span class="flecha-atras">←</span>
            Cerrar sesión
        </button>

        <span class="logo">Barbería</span>

        <button type="button" class="enlace" routerLink="/view-appointments">
            Ver citas
            <span class="flecha-sig">→</span>
        </button>

    </header>

    <!-- CONTENIDO -->
    <main class="contenido">

        <div class="encabezado">
            <span class="etiqueta">Gestión de citas</span>
            <h1 class="titulo">Agenda tu cita</h1>
            <p class="descripcion">
                Registra una nueva cita de manera rápida, sencilla y organizada.
            </p>
        </div>

        <section class="formulario">

            <h2 class="subtitulo">Selecciona la fecha y hora de tu cita</h2>

            <form (ngSubmit)="agendarCita()">

                <div class="campo">
                    <label for="fecha">Fecha y hora</label>
                    <input
                        id="fecha"
                        type="datetime-local"
                        name="fecha"
                        [(ngModel)]="fecha"
                        required />
                </div>

                <div class="formulario-footer">

                    <span class="ayuda">Verifica la fecha antes de agendar.</span>

                    <button type="submit" class="boton" [disabled]="!fecha">
                        <span>Agendar cita</span>
                        <span class="flecha">→</span>
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>
