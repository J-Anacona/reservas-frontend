<div class="container">

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="encabezado-texto">

            <span class="etiqueta">
                GESTIÓN DE CITAS
            </span>

            <h1 class="titulo">
                Agenda tu cita
            </h1>

            <p class="descripcion">
                Registra una nueva cita de manera rápida, sencilla y organizada.
            </p>

        </div>

        <div class="acciones">

            <button
                class="btn btn-secundario"
                routerLink="/view-appointments">

                <span class="icono">☷</span>

                Ver Citas

            </button>

        </div>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        <section class="formulario">

            <!-- TÍTULO DEL FORMULARIO -->
            <div class="formulario-header">

                <div>
                    <h2>
                      Completa los datos del paciente para registrar la cita.
                    </h2>

                    <p>
                        
                    </p>
                </div>

            </div>


            <!-- FORMULARIO -->
            <form (ngSubmit)="agendarCita()">

                <div class="campos">

                    <!-- NOMBRE -->
                    <div class="campo">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            id="nombre"
                            type="text"
                            [(ngModel)]="nuevaCita.nombre"
                            name="nombre"
                            placeholder="Ingrese el nombre"
                            autocomplete="given-name"
                            required>

                    </div>


                    <!-- APELLIDO -->
                    <div class="campo">

                        <label for="apellido">
                            Apellido
                        </label>

                        <input
                            id="apellido"
                            type="text"
                            [(ngModel)]="nuevaCita.apellido"
                            name="apellido"
                            placeholder="Ingrese el apellido"
                            autocomplete="family-name"
                            required>

                    </div>


                    <!-- DOCUMENTO -->
                    <div class="campo">

                        <label for="documento">
                            Documento
                        </label>

                        <input
                            id="documento"
                            type="text"
                            [(ngModel)]="nuevaCita.documento"
                            name="documento"
                            placeholder="Ingrese el documento"
                            inputmode="numeric"
                            required>

                    </div>


                    <!-- FECHA Y HORA -->
                    <div class="campo">

                        <label for="fecha">
                            Fecha y Hora
                        </label>

                        <input
                            id="fecha"
                            type="datetime-local"
                            [(ngModel)]="nuevaCita.fecha"
                            name="fecha"
                            required>

                    </div>

                </div>


                <!-- SEPARADOR -->
                <div class="separador"></div>


                <!-- BOTÓN -->
                <div class="formulario-footer">

                    <span class="ayuda">
                        Verifica los datos antes de agendar.
                    </span>

                    <button
                        type="submit"
                        class="btn btn-principal">

                        <span class="icono-boton">
                            ✓
                        </span>

                        Agendar Cita

                    </button>

                </div>

            </form>

        </section>

    </main>

</div>
