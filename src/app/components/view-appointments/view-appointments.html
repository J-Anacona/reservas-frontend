<div class="listado">

    <!-- BARRA SUPERIOR -->
    <header class="barra">
        <span class="logo">Barbería</span>
    </header>

    <div class="container">

        <!-- ENCABEZADO -->
        <div class="encabezado">
            <span class="etiqueta">Gestión de citas</span>
            <h1 class="titulo">Listado de citas</h1>
        </div>

        <!-- ACCIONES -->
        <div class="acciones">
            <button type="button" class="btn" routerLink="/citas">
                <span>Nueva cita</span>
                <span class="flecha">→</span>
            </button>
        </div>

        <!-- SIN CITAS -->
        <div class="sin-datos" *ngIf="!citas.length">
            Aún no hay citas registradas.
        </div>

        <!-- LISTA -->
        <div class="lista-citas" *ngIf="citas.length">

            <div class="card" *ngFor="let cita of citas">

                <ng-container *ngIf="esBarbero">

                    <div class="fila">
                        <span class="label">Nombre</span>
                        <span class="valor">{{ cita.nombre }}</span>
                    </div>

                    <div class="fila">
                        <span class="label">Apellido</span>
                        <span class="valor">{{ cita.apellido }}</span>
                    </div>

                    <div class="fila">
                        <span class="label">Documento</span>
                        <span class="valor">{{ cita.documento }}</span>
                    </div>

                </ng-container>

                <div class="fila">
                    <span class="label">Fecha</span>
                    <span class="valor">{{ cita.fecha }}</span>
                </div>

                <div class="fila">
                    <span class="label">Estado</span>
                    <span class="estado">{{ cita.estado }}</span>
                </div>

            </div>

        </div>

    </div>

</div>
