
<div class="listado">

    <!-- BARRA SUPERIOR -->
    <header class="barra">

        <button type="button" class="enlace" (click)="volver()">
            <span class="flecha-atras">←</span>
            Atrás
        </button>

        <span class="logo">Barbería</span>

        <span class="espacio"></span>

    </header>

    <div class="container">

        <!-- ENCABEZADO -->
        <div class="encabezado">
            <span class="etiqueta">Gestión de citas</span>
            <h1 class="titulo">Listado de citas</h1>
        </div>

        <!-- ACCIONES -->
        <div class="acciones">
            <button type="button" class="btn" routerLink="/citas">
                <span>Nueva cita</span>
                <span class="flecha">→</span>
            </button>
        </div>

        <!-- SIN CITAS PENDIENTES -->
        <div class="sin-datos" *ngIf="citasPendientes.length === 0">
            No hay citas pendientes por el momento.
        </div>

        <!-- LISTA DE CITAS PENDIENTES -->
        <div class="lista-citas" *ngIf="citasPendientes.length > 0">

            <div
                class="card card--pendiente"
                *ngFor="let cita of citasPendientes">

                <!-- HORA Y FECHA -->
                <div class="momento">

                    <div class="bloque">
                        <span class="label">Hora</span>
                        <span class="hora">{{ cita.hora }}</span>
                    </div>

                    <div class="bloque">
                        <span class="label">Fecha</span>
                        <span class="fecha">{{ cita.fecha }}</span>
                    </div>

                </div>

                <!-- ESTADO -->
                <div class="fila">
                    <span class="label">Estado</span>

                    <span class="estado estado--pendiente">
                        {{ cita.estado }}
                    </span>
                </div>

                <!-- DATOS DEL CLIENTE (SOLO BARBERO) -->
                <ng-container *ngIf="esBarbero">

                    <div class="fila">
                        <span class="label">Nombre</span>
                        <span class="valor">{{ cita.nombre }}</span>
                    </div>

                    <div class="fila">
                        <span class="label">Apellido</span>
                        <span class="valor">{{ cita.apellido }}</span>
                    </div>

                    <div class="fila">
                        <span class="label">Teléfono</span>
                        <span class="valor">{{ cita.telefono }}</span>
                    </div>

                </ng-container>

            </div>

        </div>

    </div>

</div>
