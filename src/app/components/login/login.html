    <section class="panel">
        <form class="formulario" (ngSubmit)="iniciarSesion()">

            <span class="etiqueta">Bienvenido</span>
            <h2 class="titulo">Iniciar sesión</h2>

            <div class="campo">
                <label for="email">Correo</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    [(ngModel)]="email"
                    autocomplete="email"
                    required />
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    [(ngModel)]="password"
                    autocomplete="current-password"
                    required />
            </div>

            <p class="error" *ngIf="error">{{ error }}</p>

            <button type="submit" class="boton">
                <span>Entrar</span>
                <span class="flecha">→</span>
            </button>

            <p class="pie">
                ¿No tienes cuenta?
                <a routerLink="/register">Regístrate</a>
            </p>

        </form>
    </section>

</div>
