<div class="registro">

    <section class="visual">
        <div class="marca">

            <div class="poste" aria-hidden="true">
                <div class="tapa tapa-sup"></div>
                <div class="tubo">
                    <div class="franjas"></div>
                </div>
                <div class="tapa tapa-inf"></div>
            </div>

            <h1 class="nombre">Barbería</h1>
            <p class="lema">Tu estilo, a tu hora.</p>
            <p class="mensaje">Crea tu cuenta y reserva en minutos.</p>
        </div>
    </section>

    <section class="panel">
        <form class="formulario" (ngSubmit)="registrar()">

            <span class="etiqueta">Únete</span>
            <h2 class="titulo">Crear cuenta</h2>

            <div class="fila">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input
                        id="nombre"
                        type="text"
                        name="nombre"
                        [(ngModel)]="datos.nombre"
                        autocomplete="given-name"
                        required />
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input
                        id="apellido"
                        type="text"
                        name="apellido"
                        [(ngModel)]="datos.apellido"
                        autocomplete="family-name"
                        required />
                </div>
            </div>

            <div class="campo">
                <label for="documento">Documento</label>
                <input
                    id="documento"
                    type="text"
                    name="documento"
                    [(ngModel)]="datos.documento"
                    required />
            </div>

            <div class="campo">
                <label for="email">Correo</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    [(ngModel)]="datos.email"
                    autocomplete="email"
                    required />
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    [(ngModel)]="datos.password"
                    autocomplete="new-password"
                    required />
            </div>

            <p class="error" *ngIf="error">{{ error }}</p>

            <button type="submit" class="boton">
                <span>Registrarme</span>
                <span class="flecha">→</span>
            </button>

            <p class="pie">
                ¿Ya tienes cuenta?
                <a routerLink="/login">Inicia sesión</a>
            </p>

        </form>
    </section>

</div>
