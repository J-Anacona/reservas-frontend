
<div class="registro">

    <section class="visual">
        <div class="marca">

            <div class="poste" aria-hidden="true">
                <div class="tapa tapa-sup"></div>
                <div class="tubo">
                    <div class="franjas"></div>
                </div>
                <div class="tapa tapa-inf"></div>
            </div>

            <h1 class="nombre">Barbería</h1>
            <p class="lema">Tu estilo, a tu hora.</p>
            <p class="mensaje">Crea tu cuenta y reserva en minutos.</p>
        </div>
    </section>

    <section class="panel">
        <form class="formulario" (ngSubmit)="registrar()" novalidate>

            <span class="etiqueta">Únete</span>
            <h2 class="titulo">Crear cuenta</h2>

            <div class="fila">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input
                        id="nombre"
                        type="text"
                        name="nombre"
                        [(ngModel)]="datos.nombre"
                        autocomplete="given-name"
                        placeholder="Tu nombre"
                        required />
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input
                        id="apellido"
                        type="text"
                        name="apellido"
                        [(ngModel)]="datos.apellido"
                        autocomplete="family-name"
                        placeholder="Tu apellido"
                        required />
                </div>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input
                    id="telefono"
                    type="tel"
                    name="telefono"
                    [(ngModel)]="datos.telefono"
                    autocomplete="tel"
                    inputmode="numeric"
                    maxlength="15"
                    placeholder="Tu número de teléfono"
                    required />
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    [(ngModel)]="datos.email"
                    autocomplete="email"
                    placeholder="ejemplo@correo.com"
                    required />
            </div>

            <div class="campo">
    <label for="password">Contraseña</label>

    <div class="contenedor-password">
        <input
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="datos.password"
            autocomplete="new-password"
            required />

        <button
            type="button"
            class="boton-ojo"
            (click)="alternarPassword()"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">

            <!-- Ojo abierto -->
            <svg *ngIf="!mostrarPassword"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>

            <!-- Ojo cerrado -->
            <svg *ngIf="mostrarPassword"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="m3 3 18 18"/>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a15.5 15.5 0 0 1-4 4.8"/>
                <path d="M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.1 0 2.1-.2 3-.5"/>
            </svg>
        </button>
    </div>
</div>

            <button type="submit" class="boton">
                <span>Registrarme</span>
                <span class="flecha">→</span>
            </button>

            <p class="pie">
                ¿Ya tienes cuenta?
                <a routerLink="/login">Inicia sesión</a>
            </p>

        </form>
    </section>

</div>
